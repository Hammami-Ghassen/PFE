name: Trigger auto deployment for pfe-backend

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
      - '**'
      - '.github/workflows/pfe-backend-AutoDeployTrigger-1348f481-3d79-439e-bf43-c6aeafac25bf.yml'

  # Allow manual trigger 
  workflow_dispatch:
      
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.PFEBACKEND_AZURE_CREDENTIALS }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}/server
          dockerfilePath: Dockerfile  # Looks directly inside the appSourcePath (/server) for the Dockerfile
          registryUrl: docker.io
          registryUsername: ${{ secrets.PFEBACKEND_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.PFEBACKEND_REGISTRY_PASSWORD }}
          containerAppName: pfe-backend
          resourceGroup: pfe-spring-backend_group
          imageToBuild: docker.io/ghassenhammami/grh-msp-server:${{ github.sha }}